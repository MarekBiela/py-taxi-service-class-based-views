{% extends "base.html" %}

{% block content %}
<table>
  <thead>
    <tr>
      <th>id</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
  </thead>
  <tbody>
    {% for car in driver.cars.all %}
    <tr>
      <td>{{ car.id }}</td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
